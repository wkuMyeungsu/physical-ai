<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Dark Device Screen Background -->
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14070a"/>
      <stop offset="100%" stop-color="#240c14"/>
    </linearGradient>

    <!-- Warm Cream Face Gradient -->
    <linearGradient id="creamFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffdf5"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Alert Shadow Filter -->
    <filter id="badgeShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    @keyframes alertPulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.35;
        transform: scale(0.97);
      }
    }
    @keyframes borderFlash {
      0%, 100% {
        stroke-opacity: 0.9;
      }
      50% {
        stroke-opacity: 0.2;
      }
    }
    
    /* Static default state */
    .bottom-alert {
      transform-origin: 200px 250px;
    }
    .border-alert {
      stroke-opacity: 0.6;
    }

    /* Interactive Hover State: Trigger Blinking */
    svg:hover .bottom-alert {
      animation: alertPulse 0.8s infinite ease-in-out;
    }
    svg:hover .border-alert {
      animation: borderFlash 0.8s infinite ease-in-out;
    }
  </style>

  <!-- 2.0" Rounded Screen Frame / Bezel -->
  <rect width="400" height="300" rx="36" fill="url(#screenBg)"/>
  <rect class="border-alert" x="8" y="8" width="384" height="284" rx="30" fill="none" stroke="#f43f5e" stroke-width="3"/>

  <!-- BIG FULL-SCREEN CUTE FACE (Slouched / Strained State) -->
  <g transform="translate(200, 6) scale(0.8) translate(-200, 0)">
  <g id="slouchedFace" transform="translate(180, 136) rotate(-10) translate(-180, -136)">
    <!-- Character Face filling the display -->
    <rect x="36" y="24" width="308" height="220" rx="68" fill="url(#creamFace)" stroke="#fcd34d" stroke-width="6"/>

    <!-- Strained Eyes (> < style expression) -->
    <path d="M 94 92 L 132 114 L 94 134" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 276 92 L 238 114 L 276 134" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Soft Rosy Pink Blush Cheeks -->
    <ellipse cx="88" cy="144" rx="20" ry="12" fill="#fca5a5" opacity="0.85"/>
    <ellipse cx="282" cy="144" rx="20" ry="12" fill="#fca5a5" opacity="0.85"/>

    <!-- Distressed / Worried Wavy Mouth (﹏) -->
    <path d="M 152 156 Q 166 144 180 156 Q 194 168 208 156 Q 222 144 236 156" fill="none" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>

    <!-- Blue Sweat Drop 💧 -->
    <path d="M 314 58 C 314 58 330 80 330 92 C 330 102 322 110 314 110 C 306 110 298 102 298 92 C 298 80 314 58 314 58 Z" fill="#60a5fa" stroke="#3b82f6" stroke-width="2"/>
  </g>
  </g>

  <!-- Forward-lean indicator (drawn above the face so the text stays readable) -->
  <g transform="translate(78, 36)">
    <rect x="-56" y="-16" width="112" height="32" rx="16" fill="#f43f5e" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" fill="#ffffff" font-family="'Pretendard', -apple-system, sans-serif" font-size="16" font-weight="900">앞으로 쏠림</text>
  </g>

  <!-- BOTTOM ALERT BANNER (Hover to Blink) -->
  <g class="bottom-alert" filter="url(#badgeShadow)">
    <rect x="50" y="216" width="300" height="64" rx="32" fill="#ef4444" stroke="#ffffff" stroke-width="2.5"/>
    <g transform="translate(200, 248)">
      <path d="M -96 12 L -81 -12 L -66 12 Z" fill="#ffffff" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
      <line x1="-81" y1="-4" x2="-81" y2="3" stroke="#ef4444" stroke-width="2.8" stroke-linecap="round"/>
      <circle cx="-81" cy="7.5" r="1.8" fill="#ef4444"/>
      <text x="-54" y="8" fill="#ffffff" font-family="'Pretendard', -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="0.5">거북목 감지!</text>
    </g>
  </g>
</svg>
