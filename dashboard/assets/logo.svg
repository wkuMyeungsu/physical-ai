<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Brand Deep Forest Gradient -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d6a54"/>
      <stop offset="100%" stop-color="#143e30"/>
    </linearGradient>

    <!-- Warm Cream Face Gradient -->
    <linearGradient id="logoFaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Mint Glow Accent -->
    <linearGradient id="mintAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle App/Logo Container -->
  <rect width="120" height="120" rx="32" fill="url(#logoBgGrad)"/>
  <rect x="2" y="2" width="116" height="116" rx="30" fill="none" stroke="#b8eed4" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Top Smart AI Antenna Spark -->
  <circle cx="60" cy="22" r="3.5" fill="#facc15"/>
  <path d="M 60 25 L 60 33" stroke="#b8eed4" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Monitor Clip / Base Mount Indicator -->
  <rect x="44" y="93" width="32" height="6" rx="3" fill="#1b503c"/>
  <path d="M 48 99 L 72 99 L 76 105 L 44 105 Z" fill="#0f2b21" opacity="0.8"/>

  <!-- Device Main Screen Body with Drop Shadow -->
  <g filter="url(#logoShadow)">
    <rect x="25" y="32" width="70" height="58" rx="18" fill="url(#logoFaceGrad)" stroke="#fcd34d" stroke-width="2.5"/>

    <!-- Happy Squinting Eyes (^  ^) -->
    <path d="M 39 56 Q 47 48 55 56" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <path d="M 65 56 Q 73 48 81 56" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>

    <!-- Soft Rosy Blush Cheeks -->
    <circle cx="38" cy="65" r="4.5" fill="#fca5a5" opacity="0.9"/>
    <circle cx="82" cy="65" r="4.5" fill="#fca5a5" opacity="0.9"/>

    <!-- Cute Smiling Mouth with Tongue -->
    <path d="M 54 64 Q 60 64 66 64 C 66 73 54 73 54 64 Z" fill="#ef4444" stroke="#1e293b" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 56 68 C 58 66 62 66 64 68 C 63 71 57 71 56 68 Z" fill="#fca5a5"/>
  </g>

  <!-- Dynamic Posture & Breath Ribbon Sparkles around the Character -->
  <!-- Top Right AI Sparkle ✨ -->
  <path d="M 96 24 Q 96 28 92 28 Q 96 28 96 32 Q 96 28 100 28 Q 96 28 96 24 Z" fill="#facc15"/>
  
  <!-- Subtle Mint Cervical Spine & Breath Flow Curve -->
  <path d="M 16 68 C 16 48 24 38 32 38" fill="none" stroke="url(#mintAccent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 6"/>
  <path d="M 104 68 C 104 88 96 98 88 98" fill="none" stroke="url(#mintAccent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 6"/>

  <!-- Mini Status Dot (Active Vision AI) -->
  <circle cx="85" cy="38" r="3" fill="#10b981"/>
  <circle cx="85" cy="38" r="5" fill="none" stroke="#10b981" stroke-width="1" opacity="0.6"/>
</svg>
