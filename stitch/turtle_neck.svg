<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Dark LCD Display Screen Background -->
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>

    <!-- Warm Yellow Emoji Gradient -->
    <linearGradient id="emojiYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>

    <!-- Alert Glow Filter -->
    <filter id="alertGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Drop Shadow for UI Elements -->
    <filter id="pillShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 2.0" LCD Display Frame -->
  <rect width="400" height="300" rx="20" fill="url(#screenBg)"/>

  <!-- Tech Grid Lines -->
  <line x1="24" y1="42" x2="376" y2="42" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- Top Status Bar -->
  <circle cx="36" cy="24" r="4.5" fill="#f43f5e" filter="url(#alertGlow)"/>
  <text x="48" y="28" fill="#fb7185" font-family="'Pretendard', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">ALERT • 경추 15° 전방 돌출</text>
  <text x="365" y="28" text-anchor="end" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">30 FPS AI CAM</text>

  <!-- Vertical Neutral Axis (Shoulder Line) -->
  <line x1="225" y1="52" x2="225" y2="185" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="232" y="66" fill="#64748b" font-family="'Pretendard', sans-serif" font-size="10" font-weight="600">중립 축</text>

  <!-- Angle Indicator Arc & Badge -->
  <path d="M 225 110 C 205 102 185 96 165 95" fill="none" stroke="#f97316" stroke-width="3" stroke-dasharray="4 3"/>
  <polygon points="158,95 168,90 166,100" fill="#f97316"/>
  <rect x="175" y="66" width="50" height="20" rx="5" fill="#f97316"/>
  <text x="200" y="80" fill="#ffffff" font-family="'Pretendard', sans-serif" font-size="10" font-weight="800" text-anchor="middle">15° 쏠림</text>

  <!-- CUTE EMOJI MASCOT: Turtle Neck (Side Profile) -->
  <g id="emojiTurtle">
    <!-- Body / Torso (Teal Sweatshirt - Natural Chubby Chibi) -->
    <path d="M 140 240 
             C 155 175 185 165 225 165 
             C 265 165 305 175 320 240 Z" 
          fill="#0d9488" stroke="#134e4a" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Collar Line -->
    <path d="M 165 174 Q 185 184 205 174" fill="none" stroke="#5eead4" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Slanted Chubby Neck Connection -->
    <path d="M 170 170 
             C 150 145 138 128 126 112 
             L 168 92 
             C 188 116 202 142 216 168 Z" 
          fill="url(#emojiYellow)" stroke="#ca8a04" stroke-width="4" stroke-linejoin="round"/>

    <!-- Cute Round Ear (Side View) -->
    <circle cx="160" cy="74" r="14" fill="url(#emojiYellow)" stroke="#ca8a04" stroke-width="3.5"/>
    <circle cx="160" cy="74" r="7" fill="#fde047"/>

    <!-- Round Cute Emoji Head -->
    <circle cx="140" cy="98" r="44" fill="url(#emojiYellow)" stroke="#ca8a04" stroke-width="4"/>

    <!-- Strained / Tired Eye (>_< style) -->
    <path d="M 112 92 L 124 98 L 112 104" fill="none" stroke="#854d0e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Rosy Cheek Blush -->
    <ellipse cx="124" cy="112" rx="9" ry="6" fill="#fb7185" opacity="0.75"/>

    <!-- Small Cute Troubled Mouth -->
    <path d="M 104 116 Q 110 120 116 116" fill="none" stroke="#854d0e" stroke-width="3" stroke-linecap="round"/>

    <!-- Blue Sweat Drop (💧) -->
    <g transform="translate(94, 64)">
      <path d="M 0 0 C 0 -4 7 -12 7 -12 C 7 -12 14 -4 14 0 C 14 4 7 8 7 8 C 7 8 0 4 0 0 Z" 
            fill="#38bdf8" stroke="#0284c7" stroke-width="1.8"/>
    </g>

    <!-- Red Strain Warning Badge at Neck -->
    <g transform="translate(195, 130)">
      <circle cx="0" cy="0" r="11" fill="#ef4444" opacity="0.3" filter="url(#alertGlow)"/>
      <circle cx="0" cy="0" r="6" fill="#ef4444"/>
      <!-- Warning Line & Pill -->
      <line x1="8" y1="-2" x2="22" y2="-10" stroke="#f43f5e" stroke-width="2.5"/>
      <rect x="22" y="-22" width="74" height="24" rx="7" fill="#e11d48"/>
      <text x="59" y="-6" fill="#ffffff" font-family="'Pretendard', sans-serif" font-size="11" font-weight="900" text-anchor="middle">하중 +22kg</text>
    </g>
  </g>

  <!-- Bottom Alert Pill Banner (거북목 감지 전면 표시) -->
  <g transform="translate(200, 262)" filter="url(#pillShadow)">
    <rect x="-105" y="-18" width="210" height="36" rx="18" fill="#e11d48"/>
    <!-- Warning Icon Bubble -->
    <circle cx="-80" cy="0" r="10" fill="#ffffff"/>
    <path d="M -80 -5 L -80 1 M -80 4 L -80 5.5" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Bold Text -->
    <text x="14" y="5" fill="#ffffff" font-family="'Pretendard', sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="1.5">거북목 감지</text>
  </g>
</svg>
