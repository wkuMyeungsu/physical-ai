<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Dark Device Screen Background -->
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1210"/>
      <stop offset="100%" stop-color="#142420"/>
    </linearGradient>

    <!-- Warm Cream Face Gradient -->
    <linearGradient id="creamFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffdf5"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Success Shadow Filter -->
    <filter id="badgeShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    @keyframes gentlePulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.04);
      }
    }
    @keyframes sparkleTwinkle {
      0%, 100% {
        opacity: 0.9;
        transform: scale(1);
      }
      50% {
        opacity: 0.3;
        transform: scale(0.7);
      }
    }
    
    /* Static default state */
    .bottom-badge {
      transform-origin: 200px 250px;
    }
    .sparkle-1 {
      transform-origin: 45px 52px;
      opacity: 0.7;
    }
    .sparkle-2 {
      transform-origin: 355px 52px;
      opacity: 0.7;
    }

    /* Interactive Hover State */
    svg:hover .bottom-badge {
      animation: gentlePulse 1.2s infinite ease-in-out;
    }
    svg:hover .sparkle-1 {
      animation: sparkleTwinkle 1.2s infinite ease-in-out;
    }
    svg:hover .sparkle-2 {
      animation: sparkleTwinkle 1.4s infinite ease-in-out;
    }
  </style>

  <!-- 2.0" Rounded Screen Frame / Bezel -->
  <rect width="400" height="300" rx="36" fill="url(#screenBg)"/>
  <rect x="8" y="8" width="384" height="284" rx="30" fill="none" stroke="#10b981" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Sparkles ✨ in corners -->
  <g fill="#facc15">
    <path class="sparkle-1" d="M 45 42 Q 45 52 35 52 Q 45 52 45 62 Q 45 52 55 52 Q 45 52 45 42 Z"/>
    <path class="sparkle-2" d="M 355 42 Q 355 52 345 52 Q 355 52 355 62 Q 355 52 365 52 Q 355 52 355 42 Z"/>
  </g>

  <!-- BIG FULL-SCREEN CUTE FACE (Exact match to hero device screen) -->
  <g transform="translate(200, 8) scale(0.84) translate(-200, 0)">
  <g id="fullScreenFace">
    <!-- Huge Rounded Character Face filling the display -->
    <rect x="44" y="24" width="312" height="220" rx="68" fill="url(#creamFace)" stroke="#fcd34d" stroke-width="6"/>

    <!-- Happy Squinting Eyes (^  ^) -->
    <path d="M 98 106 Q 128 72 158 106" fill="none" stroke="#1e293b" stroke-width="9" stroke-linecap="round"/>
    <path d="M 242 106 Q 272 72 302 106" fill="none" stroke="#1e293b" stroke-width="9" stroke-linecap="round"/>

    <!-- Soft Rosy Pink Blush Cheeks -->
    <ellipse cx="96" cy="136" rx="22" ry="14" fill="#fca5a5" opacity="0.85"/>
    <ellipse cx="304" cy="136" rx="22" ry="14" fill="#fca5a5" opacity="0.85"/>

    <!-- Big Happy Open Smile with Tongue (D) -->
    <path d="M 166 132 Q 200 132 234 132 C 234 174 166 174 166 132 Z" fill="#ef4444" stroke="#1e293b" stroke-width="6" stroke-linejoin="round"/>
    <path d="M 178 152 C 186 144 214 144 222 152 C 218 168 182 168 178 152 Z" fill="#fca5a5"/>
  </g>
  </g>

  <!-- BOTTOM SUCCESS BADGE (Hover to Pulse) -->
  <g class="bottom-badge" filter="url(#badgeShadow)">
    <rect x="50" y="216" width="300" height="64" rx="32" fill="#10b981" stroke="#ffffff" stroke-width="2.5"/>
    <g transform="translate(200, 248)">
      <path d="M -123 0 L -111 12 L -93 -10" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="-77" y="8" fill="#ffffff" font-family="'Pretendard', -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="0.5">바른 자세 유지 중</text>
    </g>
  </g>
</svg>
